<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- PWA & Mobile Home Screen Config -->
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fuel & LPG">
  <meta name="theme-color" content="#0f172a">
  
  <!-- App Icons (ชี้ไปที่ไฟล์ icon.png ในโฟลเดอร์เดียวกัน) -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon.png">
  
  <title>Fuel & LPG Tracker</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    /* ดันกรอบ iframe ขึ้นด้านบน 48px เพื่อซ่อนแถบแจ้งเตือนของ Google Apps Script */
    .app-frame {
      position: fixed;
      top: -48px;
      left: 0;
      width: 100vw;
      height: calc(100vh + 48px);
      height: calc(100dvh + 48px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    class="app-frame" 
    src="https://script.google.com/macros/s/AKfycbzfvgarKx8-mJrbGj4ifKH8epMV-gdvzXt5VHjO95MysLlLKBVyVgO9H-sqEDkW1qlF/exec"
    allow="camera; microphone; geolocation">
  </iframe>
</body>
</html>
