<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- *** แก้ไขส่วนนี้: เพิ่ม maximum-scale=1.0 และ user-scalable=no *** -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- PWA & Mobile Home Screen Config -->
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fuel & LPG">
  <meta name="theme-color" content="#0f172a">
  
  <!-- App Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon.png">
  
  <title>Fuel & LPG Tracker</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      /* ป้องกันการเลื่อนทั้งหน้าเว็บ */
      position: fixed;
      inset: 0;
    }
    .app-frame {
      position: absolute;
      /* ปรับระยะ top และ height ให้พอดีกับ iPhone รุ่นใหม่ที่มี Dynamic Island */
      top: -40px; /* ค่าเริ่มต้น ลองปรับเลขนี้ได้ถ้าขอบบนยังไม่พอดี */
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100% + 40px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    class="app-frame" 
    src="https://script.google.com/macros/s/AKfycbzfvgarKx8-mJrbGj4ifKH8epMV-gdvzXt5VHjO95MysLlLKBVyVgO9H-sqEDkW1qlF/exec"
    allow="camera; microphone; geolocation">
  </iframe>
</body>
</html>
